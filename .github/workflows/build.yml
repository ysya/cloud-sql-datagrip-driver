name: Build latest Cloud SQL PostgreSQL fat JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest upstream release
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/GoogleCloudPlatform/cloud-sql-jdbc-socket-factory/releases/latest | jq -r '.tag_name')"
          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Failed to resolve latest upstream release" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Latest release: $tag"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: GoogleCloudPlatform/cloud-sql-jdbc-socket-factory
          ref: ${{ steps.latest.outputs.tag }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build fat JARs
        run: mvn -P jar-with-dependencies clean package -DskipTests

      - name: Locate PostgreSQL fat JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find postgres-socket-factory -type f -name 'postgres-socket-factory-*-jar-with-dependencies.jar' | head -n 1)"
          if [[ -z "$jar_path" ]]; then
            echo "PostgreSQL fat JAR not found" >&2
            find . -type f -name '*jar-with-dependencies.jar' -print
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "Found: $jar_path"

      - name: Upload PostgreSQL connector artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-socket-factory-${{ steps.latest.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30
