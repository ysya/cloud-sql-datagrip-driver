name: Publish latest Cloud SQL PostgreSQL fat JAR

on:
  workflow_dispatch:
  schedule:
    # Poll upstream once per hour, away from the top of the hour.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: cloud-sql-postgres-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.latest.outputs.should_build }}
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.latest.outputs.version }}
      upstream_url: ${{ steps.latest.outputs.upstream_url }}

    steps:
      - name: Detect latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh api repos/GoogleCloudPlatform/cloud-sql-jdbc-socket-factory/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"$release_json")"
          upstream_url="$(jq -r '.html_url' <<<"$release_json")"

          if [[ -z "$tag" || "$tag" == "null" ]]; then
            echo "Failed to resolve latest upstream release" >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$upstream_url" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to do."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $tag"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: GoogleCloudPlatform/cloud-sql-jdbc-socket-factory
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build fat JARs
        run: mvn -P jar-with-dependencies clean package -DskipTests

      - name: Prepare PostgreSQL release assets
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t matches < <(find . -type f -name 'postgres-socket-factory-*-jar-with-dependencies.jar' -print)
          if [[ ${#matches[@]} -eq 0 ]]; then
            echo "PostgreSQL fat JAR not found. Built fat JARs were:" >&2
            find . -type f -name '*jar-with-dependencies.jar' -print >&2
            exit 1
          fi

          # There should be exactly one PostgreSQL fat JAR for a release build.
          jar_path="${matches[0]}"
          echo "Using: $jar_path"

          mkdir -p dist
          asset="dist/postgres-socket-factory-${VERSION}-jar-with-dependencies.jar"
          cp "$jar_path" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          ls -lh dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: postgres-socket-factory-${{ needs.detect.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: postgres-socket-factory-${{ needs.detect.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          UPSTREAM_URL: ${{ needs.detect.outputs.upstream_url }}
        shell: bash
        run: |
          set -euo pipefail

          # Be idempotent in case two runs observe the same upstream release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping publish."
            exit 0
          fi

          notes=$(cat <<EOF
          Prebuilt PostgreSQL Cloud SQL Java Connector fat JAR for DataGrip/IntelliJ.

          Built from the official Google Cloud SQL Java Connector release: $UPSTREAM_URL

          Build command:
          \`mvn -P jar-with-dependencies clean package -DskipTests\`

          A SHA-256 checksum is included alongside the JAR.
          EOF
          )

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Cloud SQL PostgreSQL connector $TAG" \
            --notes "$notes"
